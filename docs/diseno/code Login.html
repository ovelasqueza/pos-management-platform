</script></head><body class="bg-surface font-body-md text-body-md text-on-surface select-none"><main class="w-full min-h-screen flex items-center justify-center bg-white p-space-md"><div class="w-full max-w-md mx-auto"><div class="bg-white rounded-xl border border-slate-200 shadow-sm p-space-xl flex flex-col"><div class="flex flex-col items-center text-center mb-space-lg"><div class="w-12 h-12 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-primary mb-space-sm"><span class="material-symbols-outlined text-[28px]">point_of_sale</span></div><h1 class="font-headline-md text-headline-md text-slate-900 font-bold tracking-tight"><br></h1><p class="font-body-sm text-body-sm text-slate-500 mt-0.5">Sistema de Facturación y Ventas</p></div><form class="flex flex-col gap-space-md" onsubmit="event.preventDefault(); triggerShiftOpen();"><div class="flex flex-col gap-space-xs"><label class="font-label-caps text-label-caps text-slate-700 uppercase tracking-wider font-semibold" for="input-username">Usuario o Correo</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-3 text-slate-400 text-[20px] pointer-events-none">person</span><input class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 text-slate-900 rounded-lg font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary shadow-xs transition-colors" id="input-username" placeholder="ejemplo@comercio.com" required="" type="text"></div></div><div class="flex flex-col gap-space-xs"><label class="font-label-caps text-label-caps text-slate-700 uppercase tracking-wider font-semibold" for="input-user-password">Contraseña</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-3 text-slate-400 text-[20px] pointer-events-none">lock</span><input class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 text-slate-900 rounded-lg font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary shadow-xs transition-colors" id="input-user-password" placeholder="••••••••" required="" type="password"></div></div><button class="w-full min-h-[52px] mt-space-xs py-2.5 px-space-md rounded-lg bg-[#059669] hover:bg-[#047857] active:scale-[0.99] text-white font-headline-sm text-headline-sm flex items-center justify-center gap-space-sm shadow-xs transition-all duration-150 cursor-pointer font-bold tracking-wide" id="btn-submit-turn" type="submit"><span class="material-symbols-outlined text-[20px]">login</span><span id="btn-submit-label" class="">Ingresar al Sistema</span></button></form><div class="mt-space-lg pt-space-md border-t border-slate-200 text-center"></div><div class="mt-space-md flex items-center justify-between text-body-sm font-body-sm text-slate-400"><span class="text-[11px] font-label-data text-slate-500">Terminal: POS-01</span><span class="text-[11px] text-slate-400">v4.8.2</span></div></div></div>
<script>
  let activePin = '';
  let selectedBranch = 'Chapinero';
  let selectedMode = 'bakery';
  let activeTab = 'pin';
  let isOffline = false;

  // Realtime Clock Updater
  function updateLiveClock() {
    const clockEl = document.getElementById('current-clock');
    if (!clockEl) return;
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateLiveClock, 1000);
  updateLiveClock();

  // Pin Keypad Logic
  function pressKey(num) {
    if (activePin.length < 4) {
      activePin += num;
      renderPinDots();
      if (activePin.length === 4) {
        document.getElementById('pin-feedback').textContent = 'PIN Completo. Pulse el botón inferior.';
      }
    }
  }

  function clearPin() {
    activePin = '';
    renderPinDots();
    document.getElementById('pin-feedback').textContent = 'PIN Restablecido.';
  }

  function backspacePin() {
    if (activePin.length > 0) {
      activePin = activePin.slice(0, -1);
      renderPinDots();
      document.getElementById('pin-feedback').textContent = activePin.length > 0 ? 'Ingresando PIN...' : 'Ingrese PIN de 4 Dígitos';
    }
  }

  function renderPinDots() {
    const dots = document.querySelectorAll('.pin-dot');
    dots.forEach((dot, index) => {
      if (index < activePin.length) {
        dot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-emerald-600 scale-125 transition-all duration-150';
      } else {
        dot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-slate-300 transition-all duration-150';
      }
    });
  }

  // Branch Selection
  function selectBranch(element, branchKey) {
    selectedBranch = branchKey;
    const cards = document.querySelectorAll('.branch-card');
    cards.forEach(card => {
      card.className = 'branch-card group text-left p-space-md rounded-lg bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 transition-all duration-150 flex flex-col justify-between min-h-[96px] relative overflow-hidden';
      const icon = card.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.textContent = 'radio_button_unchecked';
        icon.className = 'material-symbols-outlined text-slate-300 text-[20px]';
      }
    });

    ['Chapinero', 'Poblado', 'Laureles', 'Centro'].forEach(key => {
      const ind = document.getElementById(`branch-indicator-${key}`);
      if (ind) ind.className = 'absolute top-0 left-0 w-1.5 h-full bg-transparent';
    });

    element.className = 'branch-card group text-left p-space-md rounded-lg bg-emerald-50/50 border-2 border-primary hover:bg-emerald-50 transition-all duration-150 flex flex-col justify-between min-h-[96px] relative overflow-hidden';
    const activeIcon = element.querySelector('.material-symbols-outlined');
    if (activeIcon) {
      activeIcon.textContent = 'check_circle';
      activeIcon.className = 'material-symbols-outlined text-primary text-[20px]';
    }

    const currentInd = document.getElementById(`branch-indicator-${branchKey}`);
    if (currentInd) currentInd.className = 'absolute top-0 left-0 w-1.5 h-full bg-primary';

    showToast('Sede Seleccionada', `Terminal enlazada a Sede ${branchKey}`);
  }

  // Business Mode Switch
  function selectBusinessMode(element, modeKey) {
    selectedMode = modeKey;
    const modeCards = document.querySelectorAll('.mode-card');
    modeCards.forEach(card => {
      card.className = 'mode-card text-left p-space-md rounded-lg bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 transition-all duration-150 flex flex-col gap-space-sm relative overflow-hidden';
    });

    document.getElementById('mode-bar-bakery').className = 'absolute top-0 left-0 w-full h-1 bg-transparent';
    document.getElementById('mode-bar-restaurant').className = 'absolute top-0 left-0 w-full h-1 bg-transparent';

    element.className = `mode-card text-left p-space-md rounded-lg ${modeKey === 'bakery' ? 'bg-emerald-50/40 border-2 border-primary' : 'bg-amber-50/30 border-2 border-amber-600'} transition-all duration-150 flex flex-col gap-space-sm relative overflow-hidden`;

    const bar = document.getElementById(`mode-bar-${modeKey}`);
    if (bar) bar.className = `absolute top-0 left-0 w-full h-1 ${modeKey === 'bakery' ? 'bg-primary' : 'bg-amber-600'}`;

    const title = modeKey === 'bakery' ? 'Panadería & Pastelería' : 'Asadero & Restaurante';
    showToast('Modo Operativo', `Configuración para ${title} cargada`);
  }

  // Switch Login Tab (PIN vs Full Creds)
  function switchLoginTab(mode) {
    activeTab = mode;
    const btnPin = document.getElementById('tab-pin');
    const btnCreds = document.getElementById('tab-creds');
    const pinSection = document.getElementById('section-pin-view');
    const credsSection = document.getElementById('section-creds-view');
    const cashierStrip = document.getElementById('cashier-strip');

    if (mode === 'pin') {
      btnPin.className = 'flex-1 py-space-sm text-center rounded-lg font-headline-sm text-headline-sm bg-white text-slate-900 shadow-xs transition-all duration-150 flex items-center justify-center gap-space-xs font-semibold';
      btnCreds.className = 'flex-1 py-space-sm text-center rounded-lg font-headline-sm text-headline-sm text-slate-600 hover:text-slate-900 transition-all duration-150 flex items-center justify-center gap-space-xs';
      pinSection.classList.remove('hidden');
      credsSection.classList.add('hidden');
      cashierStrip.classList.remove('hidden');
    } else {
      btnCreds.className = 'flex-1 py-space-sm text-center rounded-lg font-headline-sm text-headline-sm bg-white text-slate-900 shadow-xs transition-all duration-150 flex items-center justify-center gap-space-xs font-semibold';
      btnPin.className = 'flex-1 py-space-sm text-center rounded-lg font-headline-sm text-headline-sm text-slate-600 hover:text-slate-900 transition-all duration-150 flex items-center justify-center gap-space-xs';
      credsSection.classList.remove('hidden');
      pinSection.classList.add('hidden');
      cashierStrip.classList.add('hidden');
    }
  }

  // Select Quick Cashier
  function selectCashier(element, name, samplePin) {
    document.querySelectorAll('.cashier-btn').forEach(b => {
      b.className = 'cashier-btn p-space-xs rounded-lg bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 flex flex-col items-center justify-center text-center transition-all duration-150';
    });
    element.className = 'cashier-btn p-space-xs rounded-lg bg-emerald-50 border-2 border-primary flex flex-col items-center justify-center text-center transition-all duration-150';
    document.getElementById('pin-feedback').textContent = `Cajero: ${name}`;
    activePin = '';
    renderPinDots();
  }

  // Shift Trigger Simulation
  function triggerShiftOpen() {
    const btn = document.getElementById('btn-submit-turn');
    const label = document.getElementById('btn-submit-label');
    
    if (activeTab === 'pin' && activePin.length < 4) {
      document.getElementById('pin-feedback').textContent = '⚠️ Ingrese los 4 dígitos antes de abrir.';
      btn.classList.add('bg-red-600');
      btn.classList.remove('bg-[#059669]');
      setTimeout(() => {
        btn.classList.remove('bg-red-600');
        btn.classList.add('bg-[#059669]');
      }, 1000);
      return;
    }

    label.textContent = 'ABRIENDO CAJA & VALIDANDO DIAN...';
    btn.classList.add('opacity-75', 'cursor-wait');

    setTimeout(() => {
      label.textContent = 'TURNO APERTURADO CON ÉXITO';
      showToast('Apertura Exitosa', `Caja abierta en Sede ${selectedBranch} (${selectedMode.toUpperCase()})`);
      setTimeout(() => {
        label.textContent = 'INICIAR SESIÓN / ABRIR TURNO';
        btn.classList.remove('opacity-75', 'cursor-wait');
      }, 1800);
    }, 900);
  }

  // Support Modal Handling
  function showHelpModal() {
    document.getElementById('help-modal').classList.remove('hidden');
    document.getElementById('help-modal').classList.add('flex');
  }

  function closeHelpModal() {
    document.getElementById('help-modal').classList.add('hidden');
    document.getElementById('help-modal').classList.remove('flex');
  }

  // Hardware POS test printer
  function testHardware() {
    showToast('Impresora POS', 'Envío de ticket de prueba térmica a 80mm...');
  }

  // Offline contingency toggle
  function toggleOfflineMode() {
    isOffline = !isOffline;
    const btn = document.getElementById('offline-btn');
    if (isOffline) {
      btn.classList.add('bg-amber-100', 'text-amber-900', 'border-amber-300');
      showToast('Modo Contingencia Activado', 'Guardando documentos localmente sin enlace DIAN.');
    } else {
      btn.classList.remove('bg-amber-100', 'text-amber-900', 'border-amber-300');
      showToast('En Línea', 'Conectado nuevamente a servidores DIAN Colombia.');
    }
  }

  // Toast Helper
  function showToast(title, body) {
    const toast = document.getElementById('feedback-toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-body').textContent = body;
    toast.classList.remove('translate-y-24', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');
    setTimeout(() => {
      toast.classList.add('translate-y-24', 'opacity-0');
      toast.classList.remove('translate-y-0', 'opacity-100');
    }, 2800);
  }
</script></main>
